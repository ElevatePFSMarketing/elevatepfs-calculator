[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Only elevatepfs.com may put this calculator in an iframe.
# (Add your Netlify preview domain here if you need to test embedding.)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://elevatepfs.com https://www.elevatepfs.com"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
